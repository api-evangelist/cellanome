name: Cellanome
description: Cellanome is a life-sciences technology company building multimodal single-cell analysis
  instrumentation. Its R3200 Platform combines live-cell imaging with single-cell transcriptomics using
  proprietary CellCage technology to isolate, observe, and perturb individual cells and track their
  dynamics over time, with applications across neurobiology, immunology, cancer research, aging, and
  CRISPR screening. Cellanome is venture-backed (8vc, DCVC, General Catalyst, SV Angel, Wing Venture
  Capital) and surfaced in the API Evangelist network as a portfolio lead. As of this enrichment pass
  the company publishes a marketing and scientific-resources website but no public developer, API, or
  SDK surface.
